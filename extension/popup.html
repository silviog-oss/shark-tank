<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 240px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #0f2233; text-align: center; }
    h1 { font-size: 16px; margin: 4px 0 14px; }
    button { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 1px solid #e3e9ef; background: #fff; cursor: pointer; font: inherit; }
    button.primary { background: #0b6e99; color: #fff; border-color: #0b6e99; font-weight: 600; }
    p { color: #6b7c8c; font-size: 12px; margin: 6px 0 0; }
  </style>
</head>
<body>
  <div style="font-size:34px">🦈</div>
  <h1>Shark Tank</h1>
  <button id="grab" class="primary">Grab next ticket</button>
  <button id="open">Open Shark Tank</button>
  <p>Keep a Zendesk tab open — tickets get assigned to you there.</p>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
